[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
cache = true
cache_path = "cache"
solc_version = "0.8.24"
extra_output_files = ["metadata"]
extra_output = ["metadata"]

# Remappings for dependencies
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin/contracts",
    "@chainlink/contracts/=lib/chainlink/contracts",
    # "@forge-std/=lib/forge-std/src",
]

# Fuzz configuration
[fuzz]
runs = 256
max_test_rejects = 65536

# Invariant configuration
[invariant]
runs = 256
depth = 15
fail_on_revert = false
call_override = false

# Fork configurations for testing
[rpc_endpoints]
# Ethereum Sepolia
eth_sepolia = "${ETH_SEPOLIA_RPC_URL}"
# Avalanche Fuji
avax_fuji = "${AVAX_FUJI_RPC_URL}"
# Base Sepolia
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

# Etherscan verification
[etherscan]
eth_sepolia = { key = "${ETHERSCAN_API_KEY}" }
avax_fuji = { key = "${SNOWTRACE_API_KEY}", url = "https://api-testnet.snowtrace.io/api" }
base_sepolia = { key = "${BASESCAN_API_KEY}", url = "https://api-sepolia.basescan.org/api" }

# Fork testing profiles
[profile.fork_test]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
cache = true
cache_path = "cache/fork"
solc_version = "0.8.19"
extra_output_files = ["metadata"]
extra_output = ["metadata"]

# Enable fork for testing
[profile.fork]
eth_sepolia = "${ETH_SEPOLIA_RPC_URL}"
avax_fuji = "${AVAX_FUJI_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
